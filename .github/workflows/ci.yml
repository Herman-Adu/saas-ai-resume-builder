name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts requires this at `prisma generate` (postinstall); generate never connects.
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      # Required by src/env.ts at build, but no browser test calls these services.
      POSTGRES_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_URL_NO_SSL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_USER: ci
      POSTGRES_HOST: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DATABASE: ci
      BLOB_READ_WRITE_TOKEN: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      # Signed-in test fixtures write these ids into the subscription row.
      NEXT_PUBLIC_STRIPE_PRICE_ID_PRO_MONTHLY: price_ci_pro_monthly
      NEXT_PUBLIC_STRIPE_PRICE_ID_PRO_PLUS_MONTHLY: price_ci_pro_plus_monthly
    steps:
      - name: Require app secrets
        run: |
          missing=""
          [ -z "$BETTER_AUTH_SECRET" ] && missing="$missing BETTER_AUTH_SECRET"
          [ -z "$POSTGRES_PRISMA_URL" ] && missing="$missing POSTGRES_PRISMA_URL"
          [ -z "$POSTGRES_URL_NON_POOLING" ] && missing="$missing POSTGRES_URL_NON_POOLING"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing. Add them under Settings, Secrets and variables, Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Database has every migration
        # Read-only. The browser tests use the shared Neon database, so CI never applies migrations:
        # apply them first (db-schema-change skill), then this step passes.
        run: npx prisma migrate status
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser tests (smoke, seo, axe, authed)
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000 --timeout 120000
          E2E_BASE_URL=http://localhost:3000 npm run test:e2e
